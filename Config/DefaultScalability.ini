; Epic keeps the existing scene render scale, GI, shadows and TSR history.
; Trace alternate reflection pixels (2x1 checkerboard), then use Lumen's
; existing spatial/temporal reconstruction. This saves rays, not geometry.
; Cinematic retains the full reflection grid for comparisons/captures.
; Explicit resets prevent checkerboarding leaking across preset changes.
[ReflectionQuality@0]
r.Lumen.Reflections.DownsampleCheckerboard=0

[ReflectionQuality@1]
r.Lumen.Reflections.DownsampleCheckerboard=0

[ReflectionQuality@2]
r.Lumen.Reflections.DownsampleCheckerboard=0

[ReflectionQuality@3]
r.Lumen.Reflections.DownsampleFactor=2
r.Lumen.Reflections.DownsampleCheckerboard=1

[ReflectionQuality@Cine]
r.Lumen.Reflections.DownsampleCheckerboard=0
